services:
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health_local_only
      POSTGRES_DB: health
    volumes:
      - health_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U health -d health']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  health_data:
